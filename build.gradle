// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google() // For Android Gradle Plugin
        mavenCentral() // For other buildscript dependencies if any, and good practice
        maven { url 'https://jitpack.io' } // Kept if specific plugins need it
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

// allprojects repositories block removed as it's now handled by settings.gradle

task clean(type: Delete) {
    delete rootProject.buildDir
}
